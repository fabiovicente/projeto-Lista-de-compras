# =============================================
# CONFIGURAÇÃO DO BANCO DE DADOS H2
# =============================================

# URL do banco H2 em memória.
# "mem:listadecompras" é o nome do banco — pode ser qualquer nome.
spring.datasource.url=jdbc:h2:mem:listadecompras

# Driver do H2
spring.datasource.driver-class-name=org.h2.Driver

# Usuário e senha padrão do H2 (pode deixar assim para estudos)
spring.datasource.username=sa
spring.datasource.password=

# Dialeto SQL que o JPA deve usar para gerar as queries
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Ativa o console web do H2.
# Acesse http://localhost:8080/h2-console para visualizar o banco pelo navegador!
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# =============================================

# "create-drop": cria as tabelas ao iniciar e as apaga ao encerrar.
# Bom para estudos. Em produção, use "validate" ou "none".
spring.jpa.hibernate.ddl-auto=create-drop

# Exibe no console as queries SQL que o JPA executa (ótimo para aprender!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# CONFIGURAÇÃO DO SERVIDOR
# =============================================

# Porta onde a aplicação vai rodar (padrão já é 8080, mas deixamos explícito)
server.port=8080
